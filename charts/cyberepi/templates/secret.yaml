{{- $dbName := printf "%s-db" (include "cyberepi.fullname" .) }}
{{- $authName := printf "%s-auth" (include "cyberepi.fullname" .) }}
{{- $existingDb := lookup "v1" "Secret" .Release.Namespace $dbName }}
{{- $existingAuth := lookup "v1" "Secret" .Release.Namespace $authName }}
{{- $dbPass := .Values.postgresql.password }}
{{- if and (not $dbPass) $existingDb }}
{{- $dbPass = index $existingDb.data "password" | b64dec }}
{{- else if not $dbPass }}
{{- $dbPass = randAlpha 24 }}
{{- end }}
{{- $authPass := .Values.auth.bootstrapPassword }}
{{- if and (not $authPass) $existingAuth }}
{{- $authPass = index $existingAuth.data "password" | b64dec }}
{{- else if not $authPass }}
{{- $authPass = randAlpha 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authName }}
  labels:
    app.kubernetes.io/name: {{ include "cyberepi.name" . }}
type: Opaque
stringData:
  username: {{ .Values.auth.bootstrapUser | quote }}
  password: {{ $authPass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  labels:
    app.kubernetes.io/name: {{ include "cyberepi.name" . }}
type: Opaque
stringData:
  password: {{ $dbPass | quote }}
  url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgresql.user $dbPass (include "cyberepi.fullname" .) .Values.postgresql.database | quote }}
