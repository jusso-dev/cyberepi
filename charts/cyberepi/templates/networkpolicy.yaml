{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cyberepi.fullname" . }}-default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cyberepi.name" . }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cyberepi.name" . }}
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
        - port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cyberepi.name" . }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 443
          protocol: TCP
{{- end }}
