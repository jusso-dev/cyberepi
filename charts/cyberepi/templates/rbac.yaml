{{- if .Values.topologyReader.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cyberepi.fullname" . }}-topology-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "serviceaccounts", "persistentvolumes", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cyberepi.fullname" . }}-topology-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cyberepi.fullname" . }}-topology-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cyberepi.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cyberepi.fullname" . }}-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cyberepi.fullname" . }}-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cyberepi.fullname" . }}-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "cyberepi.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
