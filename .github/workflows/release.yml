name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jusso-dev/cyberepi:${{ github.ref_name }}
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jusso-dev/cyberepi-web:${{ github.ref_name }}
          sbom: true
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: cyberepi.spdx.json
      - run: sha256sum cyberepi.spdx.json > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cyberepi.spdx.json
            checksums.txt

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm package charts/cyberepi
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
