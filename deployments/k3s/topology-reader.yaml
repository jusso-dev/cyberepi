# Read-only discovery role for turning cluster metadata into a synthetic
# contact graph. It cannot create, update, patch, delete, bind, escalate,
# or impersonate. Secret values must not be requested; use PartialObjectMetadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cyberepi-topology-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "serviceaccounts", "persistentvolumes", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
