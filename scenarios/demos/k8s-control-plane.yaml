apiVersion: cyberepi.io/v1
kind: Scenario
metadata:
  name: kubernetes-control-plane-exposure
  description: >
    Synthetic cloud-native population. Edges are RBAC and runtime
    relationships, not an attack on a real cluster.
population:
  template: cloud-native-startup
  size: 600
  seed: 5
  name: Synthetic Cloud Native Startup
pathogen:
  type: CloudControlPlane
initial_conditions:
  infected_entities: 1
  strategy: targeted
model: seidqrp
controls: {}
simulation:
  algorithm: gillespie
  duration: 4d
  runs: 80
  seed: 9
variants:
  - name: Baseline
    controls: {}
  - name: Least privilege + rapid isolation
    controls:
      least_privilege:
        coverage: 0.8
      rapid_isolation:
        coverage: 0.9
        isolation_delay: 20m
